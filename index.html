
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій список справ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Мій список справ</h1>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Введіть нове завдання..."
                required
            >
            <button type="submit" id="addButton">Додати</button>
        </form>

        <p id="status">Завантаження...</p>

        <h3>Мої завдання: <span id="counter">0</span></h3>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
